name: "CI & Invariant Guardrails"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-invariants:
    name: Verify Invariants & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Audit Financial Primitives (Invariant 1: No Double/Float in money fields)"
        run: |
          echo "Scanning for forbidden Double/Float declarations in financial domain models..."
          if [ -d "app/src" ]; then
            # Check for Double or Float in domain model or DTO amount fields
            FORBIDDEN_MONEY=$(grep -rnE '(val|var)\s+[a-zA-Z0-9_]*(amount|balance|deposit|expense|target|total)[a-zA-Z0-9_]*\s*:\s*(Double|Float)' app/src/ || true)
            if [ -n "$FORBIDDEN_MONEY" ]; then
              echo "::error::Invariant 1 Violation! Found forbidden Double or Float monetary field:"
              echo "$FORBIDDEN_MONEY"
              exit 1
            fi
          fi
          echo "No forbidden monetary primitives detected."

      - name: "Audit Localization (Invariant 6: Strings in strings.xml)"
        run: |
          echo "Localization pre-check ready."

  firestore-rules-tests:
    name: Firestore Security Rules (Emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Set up JDK 17 (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Firebase emulator JAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firestore-tests/package-lock.json') }}

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run rules suite against the Firestore emulator
        run: npx firebase --config ../firebase.json emulators:exec --only firestore --project demo-fundcircle "npm test"

  android-build-and-test:
    name: Android Build & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check Gradle Wrapper
        id: check_wrapper
        run: |
          if [ -f "./gradlew" ]; then
            echo "gradlew_exists=true" >> $GITHUB_OUTPUT
            chmod +x ./gradlew
          else
            echo "gradlew_exists=false" >> $GITHUB_OUTPUT
            echo "No gradlew found yet. Skipping Gradle tasks until Android project is scaffolded."
          fi

      - name: Run Unit Tests
        if: steps.check_wrapper.outputs.gradlew_exists == 'true'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        if: steps.check_wrapper.outputs.gradlew_exists == 'true'
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Debug APK
        if: steps.check_wrapper.outputs.gradlew_exists == 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble Release APK (R8 Minification & Resource Shrinking)
        if: steps.check_wrapper.outputs.gradlew_exists == 'true'
        run: ./gradlew assembleRelease --no-daemon
