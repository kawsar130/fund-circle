name: Google Play Store Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` cannot see a variable defined in that same step's `env:`,
      # and the `secrets` context is not allowed in step `if:` at all. Expose only
      # booleans here (never the secret values) so steps can branch on them.
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Build Android App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        # app/build.gradle.kts reads these env vars, signs with app/release-keystore.jks,
        # and fails fast if signing or WEB_CLIENT_ID is missing.
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove Keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Note skipped Play upload
        if: env.HAS_PLAY_CREDENTIALS != 'true'
        run: echo "::notice::PLAY_CONSOLE_SERVICE_ACCOUNT_JSON is not set; skipping Google Play upload. The signed AAB is attached as a workflow artifact."

      - name: Deploy to Google Play Closed Testing Track
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.fundcircle.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
